name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run tests
        run: dotnet run --project .\tests\CodexBadge.Core.Tests\CodexBadge.Core.Tests.csproj --configuration Release

  tauri-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CodexBadge.Tauri
    steps:
      - uses: actions/checkout@v7
      - name: Frontend tests
        run: node --test tests/frontend.test.cjs tests/celebration.test.cjs
      - name: Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Identify Rust compiler for cache
        id: rust-version
        shell: pwsh
        run: '"version=$(rustc --version)" >> $env:GITHUB_OUTPUT'
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            CodexBadge.Tauri/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ steps.rust-version.outputs.version }}-${{ hashFiles('CodexBadge.Tauri/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tauri-${{ steps.rust-version.outputs.version }}-${{ hashFiles('CodexBadge.Tauri/src-tauri/Cargo.lock') }}-
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Install locked build dependencies
        run: npm ci
      - name: Build Windows NSIS package
        run: npm run build -- -- --locked
